name: checks

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate content
        # --strict so warnings (stale review dates, thin summaries, duplicate
        # titles) block the merge rather than accumulating unnoticed.
        run: python scripts/validate.py --strict

      - name: Build retrieval index
        run: |
          python scripts/build_index.py --out dist/index.jsonl
          python scripts/build_index.py --stats

      - name: Retrieval evals
        # Every committed query must still reach its article. A failure here is
        # a content problem: see .claude/skills/retrieval-eval/SKILL.md.
        run: python scripts/run_evals.py --k 5 --min-recall 1.0 --verbose

      - name: Tooling tests
        run: python -m pytest tests/ -q

      - name: Upload index
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: index-jsonl
          path: dist/index.jsonl
          retention-days: 14
